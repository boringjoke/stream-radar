spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: "${DB_URL:}"
    username: "${DB_USERNAME:}"
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: "${DB_CONNECTION_TIMEOUT_MS:30000}"
      maximum-pool-size: "${DB_MAX_POOL_SIZE:20}"
      minimum-idle: "${DB_MIN_IDLE:5}"
  data:
    redis:
      host: "${REDIS_HOST:}"
      port: "${REDIS_PORT:6379}"
      username: "${REDIS_USERNAME:}"
      password: "${REDIS_PASSWORD:}"
      database: "${REDIS_DATABASE:0}"
      connect-timeout: "${REDIS_CONNECT_TIMEOUT:5s}"
      timeout: "${REDIS_COMMAND_TIMEOUT:2s}"
  flyway:
    enabled: "${FLYWAY_ENABLED:true}"
    locations: "${FLYWAY_LOCATIONS:classpath:db/migration}"
    validate-on-migrate: "${FLYWAY_VALIDATE_ON_MIGRATE:true}"
  session:
    store-type: redis
    timeout: "${SESSION_TIMEOUT:30m}"
    redis:
      namespace: "${SESSION_REDIS_NAMESPACE:stream-radar:prod:session}"
      flush-mode: "${SESSION_REDIS_FLUSH_MODE:on_save}"
      save-mode: "${SESSION_REDIS_SAVE_MODE:on_set_attribute}"
  web:
    error:
      include-message: "${SERVER_ERROR_INCLUDE_MESSAGE:never}"
      include-binding-errors: "${SERVER_ERROR_INCLUDE_BINDING_ERRORS:never}"

logging:
  level:
    root: "${LOG_LEVEL_ROOT:INFO}"
    com.hotchpotch.radarbackend: "${LOG_LEVEL_APP:INFO}"

server:
  forward-headers-strategy: "${SERVER_FORWARD_HEADERS_STRATEGY:framework}"
  servlet:
    session:
      cookie:
        name: "${SESSION_COOKIE_NAME:STREAMRADAR_PROD_SESSION}"
        http-only: "${SESSION_COOKIE_HTTP_ONLY:true}"
        same-site: "${SESSION_COOKIE_SAME_SITE:lax}"
        secure: "${SESSION_COOKIE_SECURE:true}"

radar:
  security:
    csrf:
      cookie-same-site: "${CSRF_COOKIE_SAME_SITE:lax}"
      cookie-secure: "${CSRF_COOKIE_SECURE:true}"
