spring:
  application:
    name: radar-backend
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:dev}"
  datasource:
    url: "${DB_URL:}"
    username: "${DB_USERNAME:}"
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: "${DB_CONNECTION_TIMEOUT_MS:30000}"
      maximum-pool-size: "${DB_MAX_POOL_SIZE:10}"
      minimum-idle: "${DB_MIN_IDLE:2}"
  data:
    redis:
      host: "${REDIS_HOST:127.0.0.1}"
      port: "${REDIS_PORT:6379}"
      username: "${REDIS_USERNAME:}"
      password: "${REDIS_PASSWORD:}"
      database: "${REDIS_DATABASE:0}"
      connect-timeout: "${REDIS_CONNECT_TIMEOUT:5s}"
      timeout: "${REDIS_COMMAND_TIMEOUT:2s}"
  flyway:
    enabled: "${FLYWAY_ENABLED:true}"
    locations: "${FLYWAY_LOCATIONS:classpath:db/migration}"
    validate-on-migrate: "${FLYWAY_VALIDATE_ON_MIGRATE:true}"
  session:
    store-type: redis
    timeout: "${SESSION_TIMEOUT:30m}"
    redis:
      namespace: "${SESSION_REDIS_NAMESPACE:stream-radar:session}"
      flush-mode: "${SESSION_REDIS_FLUSH_MODE:on_save}"
      save-mode: "${SESSION_REDIS_SAVE_MODE:on_set_attribute}"

server:
  port: "${SERVER_PORT:8080}"
  servlet:
    session:
      cookie:
        name: "${SESSION_COOKIE_NAME:STREAMRADAR_SESSION}"
        http-only: "${SESSION_COOKIE_HTTP_ONLY:true}"
        same-site: "${SESSION_COOKIE_SAME_SITE:lax}"
        secure: "${SESSION_COOKIE_SECURE:false}"

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: "${MYBATIS_MAP_UNDERSCORE_TO_CAMEL_CASE:true}"

radar:
  monitor:
    fixed-delay-ms: "${MONITOR_FIXED_DELAY_MS:60000}"
    initial-delay-ms: "${MONITOR_INITIAL_DELAY_MS:10000}"
    follow-limit: "${FOLLOW_LIMIT:100}"
  http:
    connect-timeout-ms: "${HTTP_CONNECT_TIMEOUT_MS:5000}"
    response-timeout-ms: "${HTTP_RESPONSE_TIMEOUT_MS:10000}"
    read-timeout-ms: "${HTTP_READ_TIMEOUT_MS:10000}"
    write-timeout-ms: "${HTTP_WRITE_TIMEOUT_MS:10000}"
    max-in-memory-size: "${HTTP_MAX_IN_MEMORY_SIZE:2MB}"
